<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/frontend/static/favicon-32x32.png"/>  
    <link rel="stylesheet" href="/frontend/font-awesome-4.7.0/css/font-awesome.css">
    <link rel="stylesheet" href="/frontend/static/css/styles.css">
 
    <div class="toggle">
        <button id="theme-toggle">
            <i class="fa fa-moon-o" aria-hidden="true"></i>
        </button>
    </div>
   

</head>
<body>
    <div class="wrapper">
        <div class="header">
            <a href="/"><img src="/frontend/static/logo.png" alt="Logo" class="logo-img"></a>
            <center><h1>Image Gallery</h1></center>
        </div>

        <div class="gallery" id="main">
            <!-- images here -->
                {% for image in results %}
                    <div class="image-container">
                        <img src="{{ image.urls.thumb }}" data-src="{{ image.urls.fhd }}" alt="Photo"
                        onclick="window.location.href='{{ request.url_for('view_image',image_id=image.id)}}'">
                    </div>
                {% endfor %}
        </div>

        <!-- pagination -->
        <div class="pagination">
            {% if page > 1 %}
            <a href="{{ request.url_for('home') }}?page={{ page-1 }}">
                <button id="btnPrevious">&larr; </button>
            </a>
            {% endif %}

            <span id="page">Page {{ page }} of {{ total_pages }}</span>
                    
            {% if page < total_pages %}
            <a href="{{ request.url_for('home') }}?page={{ page+1 }}">
                <button id="btnNext">&rarr;</button>
            </a>
            {% endif %}
        </div>
        <div class="footer">
            <h5><strong><center>&copy;2025</strong></center></h5>
        </div>
    </div>
    <script src="/frontend/static/js/scripts.js"></script>
</body>
</html>
